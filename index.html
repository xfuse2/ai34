
<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pro AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: 'var(--brand-color)',
              appBg: 'var(--bg-color)',
              sidebarBg: 'var(--sidebar-bg)',
              borderColor: 'var(--border-color)',
              primaryText: 'var(--text-primary)',
              secondaryText: 'var(--text-secondary)',
              inputBg: 'var(--input-bg)',
              userBubble: 'var(--user-bubble-bg)',
              aiBubble: 'var(--ai-bubble-bg)',
              aiBubbleBorder: 'var(--ai-bubble-border)',
              hoverBg: 'var(--hover-bg)',
              dropdownBg: 'var(--dropdown-bg)',
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --brand-color: #4da6ff;
        --bg-color: #0d0d0d;
        --sidebar-bg: #141414;
        --border-color: #262626;
        --text-primary: #f2f2f2;
        --text-secondary: #8c8c8c;
        --input-bg: #1a1a1a;
        --dropdown-bg: #1c1c1c;
        --hover-bg: rgba(255, 255, 255, 0.03);
      }

      [data-theme='light'] {
        --bg-color: #ffffff;
        --sidebar-bg: #f7f7f8;
        --border-color: #e5e5e5;
        --text-primary: #1a1a1a;
        --text-secondary: #666666;
        --input-bg: #ffffff;
        --dropdown-bg: #ffffff;
        --hover-bg: rgba(0, 0, 0, 0.02);
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      ::selection { background-color: rgba(77, 166, 255, 0.3); color: white; }

      html, body, #root {
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      }

      .markdown-content { 
        line-height: 1.85; 
        font-size: 1.05rem;
      }
      
      .markdown-content p { margin-bottom: 1.5rem; }
      .markdown-content h1, .markdown-content h2, .markdown-content h3 { 
        font-weight: 900; 
        margin: 2rem 0 1rem 0; 
        color: var(--brand-color);
        letter-spacing: -0.02em;
      }
      .markdown-content h1 { font-size: 2rem; }
      .markdown-content h2 { font-size: 1.6rem; }
      .markdown-content h3 { font-size: 1.3rem; }

      .markdown-content ul, .markdown-content ol { 
        margin-bottom: 1.5rem; 
        padding-right: 1.5rem; 
      }
      .markdown-content li { margin-bottom: 0.5rem; }

      .markdown-content pre {
        direction: ltr !important;
        background: #000 !important;
        border-radius: 1.5rem;
        padding: 1.5rem;
        overflow-x: auto;
        margin: 2rem 0;
        border: 1px solid var(--border-color);
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      }

      .markdown-content code {
        font-family: 'Fira Code', 'Cascadia Code', monospace;
        font-size: 0.9em;
        background: rgba(77, 166, 255, 0.1);
        padding: 0.2rem 0.4rem;
        border-radius: 0.4rem;
        color: var(--brand-color);
      }
      
      .markdown-content pre code {
        background: transparent;
        padding: 0;
        color: #e3e3e3;
      }

      .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
      
      @media (max-width: 767px) {
        .sidebar-mobile {
          position: fixed;
          top: 0;
          bottom: 0;
          z-index: 1000;
          width: 85vw !important;
          transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        [dir="rtl"] .sidebar-mobile.closed { transform: translateX(100%); }
        [dir="ltr"] .sidebar-mobile.closed { transform: translateX(-100%); }
      }

      .ui-no-select { user-select: none; -webkit-user-select: none; }
      .chat-selectable { user-select: text !important; -webkit-user-select: text !important; }

      /* --- إعدادات الطباعة النهائية --- */
      @media print {
        @page { size: A4; margin: 1.5cm; }
        
        /* 1. إخفاء كل العناصر التي تحمل فئة no-print أو الأزرار أو القوائم */
        .no-print, header, aside, button, nav, footer:not(.print-content footer), 
        [role="button"], input, textarea, .bg-gradient-to-t {
          display: none !important;
        }

        /* 2. تحرير كافة الحاويات من قيود الارتفاع والتمرير */
        html, body, #root, main, .flex-1, .flex, .flex-col, .relative {
          height: auto !important;
          min-height: auto !important;
          max-height: none !important;
          overflow: visible !important;
          position: static !important;
          width: 100% !important;
          background: white !important;
          color: black !important;
        }

        /* 3. إجبار حاوية الطباعة على الظهور بالكامل */
        .print-content {
          display: block !important;
          visibility: visible !important;
          position: static !important;
          width: 100% !important;
          height: auto !important;
          padding: 0 !important;
          margin: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }

        /* 4. إجبار المتصفح على طباعة الألوان والخلفيات */
        * {
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }

        /* 5. تنسيق نصوص الطباعة */
        .markdown-content {
          font-size: 11pt !important;
          line-height: 1.5 !important;
          color: black !important;
        }

        /* منع قص العناصر في منتصف الصفحة */
        section, p, pre, li {
          page-break-inside: avoid;
          break-inside: avoid;
        }
      }
    </style>
<script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-markdown": "https://esm.sh/react-markdown@^9.0.1",
    "remark-gfm": "https://esm.sh/remark-gfm@^4.0.0",
    "framer-motion": "https://esm.sh/framer-motion@^11.11.11",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
<body class="h-screen overflow-hidden">
    <div id="root" class="h-full w-full"></div>
</body>
</html>
